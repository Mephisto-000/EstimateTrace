name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COREPACK_HOME: ${{ github.workspace }}/.corepack
  NEXT_TELEMETRY_DISABLED: "1"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Set up project-local pnpm
        shell: bash
        run: |
          mkdir -p "$COREPACK_HOME/shims"
          corepack install --global pnpm@10.34.5
          corepack enable --install-directory "$COREPACK_HOME/shims"
          echo "$COREPACK_HOME/shims" >> "$GITHUB_PATH"
          "$COREPACK_HOME/shims/pnpm" --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Check basic secret hygiene
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v -E '(^|/)\.env\.example$'; then
            echo "::error::A local environment file is tracked."
            exit 1
          fi

          if git grep -I -n -E -- '-----BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}'; then
            echo "::error::A tracked file matches a high-confidence secret pattern."
            exit 1
          fi

      - name: Build production application
        run: pnpm build

  e2e:
    name: End-to-end tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Set up project-local pnpm
        shell: bash
        run: |
          mkdir -p "$COREPACK_HOME/shims"
          corepack install --global pnpm@10.34.5
          corepack enable --install-directory "$COREPACK_HOME/shims"
          echo "$COREPACK_HOME/shims" >> "$GITHUB_PATH"
          "$COREPACK_HOME/shims/pnpm" --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production application
        run: pnpm build

      - name: Run desktop and mobile E2E tests
        run: pnpm test:e2e
